name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: docker compose up -d --wait postgres redis neo4j qdrant minio
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run alembic check
        working-directory: backend
      - run: uv run pytest -m integration
        working-directory: backend
      - if: failure()
        run: docker compose logs --tail=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pip-audit
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements.txt" >/dev/null
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"
      - name: npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # Real API, real stores, scripted model (frontend/e2e/api_server.py). The live-LLM smoke is on demand only.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose up -d --wait postgres redis neo4j qdrant minio
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run playwright install --with-deps chromium # the API's PDF export renderer
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - if: failure()
        run: docker compose logs --tail=80
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
