services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://blog:blog@postgres:5432/blog
      JWT_SECRET: ${JWT_SECRET}
      PORT: "4000"
    depends_on:
      - postgres

  web:
    build: ./web
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:
