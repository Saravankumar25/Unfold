apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shortlink
  annotations:
    kubernetes.io/ingress.class: gce
spec:
  rules:
    - host: sho.rt
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shortlink
                port:
                  number: 80
