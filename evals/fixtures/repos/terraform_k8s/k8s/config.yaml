apiVersion: v1
kind: ConfigMap
metadata:
  name: shortlink-config
data:
  LISTEN_ADDR: ":8080"
  BASE_URL: "https://sho.rt"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shortlink
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shortlink
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
