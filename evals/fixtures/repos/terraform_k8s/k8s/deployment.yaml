apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortlink
  labels:
    app: shortlink
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shortlink
  template:
    metadata:
      labels:
        app: shortlink
    spec:
      containers:
        - name: shortlink
          image: europe-west1-docker.pkg.dev/my-project/shortlink/shortlink:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shortlink-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shortlink-db
                  key: url
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
