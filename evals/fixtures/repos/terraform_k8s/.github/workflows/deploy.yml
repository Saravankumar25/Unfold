name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/my-project/shortlink/shortlink

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
        working-directory: app

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
      - run: docker build -t $IMAGE:${{ github.sha }} ./app
      - run: docker push $IMAGE:${{ github.sha }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: shortlink-gke
          location: europe-west1
      - run: kubectl apply -f k8s/
      - run: kubectl set image deployment/shortlink shortlink=$IMAGE:${{ github.sha }}
